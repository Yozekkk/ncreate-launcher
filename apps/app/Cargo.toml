[package]
name = "ncreate-launcher"
version = "0.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Official NCreate Minecraft launcher"
[dependencies]
ncreate-app-lib = { path = "../../packages/app-lib" }
ncreate-launcher-core = { path = "../../packages/launcher-core" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
zeroize = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-window-state = "2.4"
tauri-plugin-autostart = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "time", "rt-multi-thread", "macros"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "derive"] }
uuid = { version = "1", features = ["serde", "v4"] }
md5 = "0.8"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
url = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tiny_http = "0.12"
scopeguard = "1"
rand = "0.8"
tauri-plugin-updater = "2.13.0"
semver = "1"
sha2 = "0.10"
[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
minisign-verify = "0.2.5"
