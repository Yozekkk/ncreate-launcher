name: Desktop release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check release tag matches app version
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) throw new Error('Use a semantic version tag such as v0.1.0');
          const expected = tag.slice(1);
          const files = ['package.json', 'apps/app/package.json', 'apps/app-frontend/package.json', 'apps/app/tauri.conf.json'];
          for (const file of files) {
            const { version } = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (version !== expected) throw new Error(`${file}: version ${version} does not match ${tag}`);
          }
          const metadata = JSON.parse(execFileSync('cargo', ['metadata', '--format-version', '1', '--no-deps', '--locked'], { encoding: 'utf8' }));
          for (const pkg of metadata.packages.filter(pkg => metadata.workspace_members.includes(pkg.id) && pkg.name.startsWith('ncreate-'))) {
            if (pkg.version !== expected) throw new Error(`${pkg.manifest_path}: version ${pkg.version} does not match ${tag}`);
          }
          JS
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepr:frontend:app
      - run: pnpm build
      - run: node --test scripts/release-assets.test.mjs
      - run: cargo fmt --package ncreate-launcher --package ncreate-app-lib --package ncreate-launcher-core --check
      - run: cargo check --locked -p ncreate-launcher -p ncreate-app-lib -p ncreate-launcher-core --all-targets
      - run: cargo clippy --locked -p ncreate-launcher -p ncreate-app-lib -p ncreate-launcher-core --all-targets --no-deps -- -D warnings
      - run: cargo test --locked -p ncreate-launcher -p ncreate-app-lib -p ncreate-launcher-core
      - run: node scripts/check-stage2-boundary.mjs
      - name: Build production installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo 'Updater signing secrets are required for release builds.' >&2
            exit 1
          fi
          pnpm app:build --bundles ${{ matrix.bundles }}
      - name: Stage named release artifacts
        run: node scripts/release-assets.mjs stage
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Include corresponding GPL source and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-assets.mjs metadata
          git archive --format=tar.gz --prefix="ncreate-launcher-${RELEASE_TAG}/" --output="release-assets/NCreate-Launcher-${RELEASE_TAG}-source.tar.gz" HEAD
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { releaseChannel } from './scripts/release-assets.mjs';
          const tag = process.env.RELEASE_TAG;
          const repository = process.env.GITHUB_REPOSITORY;
          const version = tag.slice(1);
          const expected = [
            `NCreate-Launcher-Setup-${version}.exe`,
            `NCreate-Launcher-Setup-${version}.exe.sig`,
            `NCreate-Launcher-${version}.AppImage`,
            `NCreate-Launcher-${version}.AppImage.sig`,
            `NCreate-Launcher-${version}-amd64.deb`,
            `NCreate-Launcher-${tag}-source.tar.gz`,
            'latest.json',
            'SHA256SUMS.txt',
          ];
          const gh = args => execFileSync('gh', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
          // The release-by-tag endpoint returns 404 for drafts, so include drafts from the list endpoint.
          const releaseState = () => JSON.parse(gh(['api', '--paginate', '--slurp', `repos/${repository}/releases?per_page=100`]))
            .flat()
            .find(release => release.tag_name === tag) ?? null;
          const waitForRelease = async predicate => {
            for (let attempt = 0; attempt < 15; attempt++) {
              const current = releaseState();
              if (predicate(current)) return current;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            return releaseState();
          };
          for (const name of expected) {
            const file = path.join('release-assets', name);
            if (!fs.statSync(file).isFile() || fs.statSync(file).size === 0) throw new Error(`Missing or empty release asset: ${name}`);
          }
          const notesPath = path.join('docs', 'releases', `${tag}.md`);
          const notes = fs.existsSync(notesPath)
            ? fs.readFileSync(notesPath, 'utf8')
            : `# NCreate Launcher ${tag}\n\nWindows x64 and Linux x64 desktop packages, corresponding source and SHA256 checksums are attached.\n`;
          const title = notes.match(/^# (.+)$/m)?.[1] ?? `NCreate Launcher ${tag}`;
          const channel = releaseChannel(tag, title);
          const metadata = JSON.parse(fs.readFileSync(path.join('release-assets', 'latest.json'), 'utf8'));
          if (metadata.version !== version || metadata.channel !== channel) throw new Error('Updater metadata does not match release version/channel');
          let release = releaseState();
          if (release && !release.draft) {
            const missing = expected.filter(name => !release.assets.some(asset => asset.name === name));
            if (missing.length) throw new Error(`Published release ${tag} is missing assets: ${missing.join(', ')}`);
            if (release.prerelease !== (channel === 'beta')) throw new Error(`Published release ${tag} has the wrong update channel`);
            console.log(`Release ${tag} is already published with all expected assets.`);
          } else {
            const temporary = fs.mkdtempSync(path.join(os.tmpdir(), 'ncreate-release-'));
            try {
              const body = path.join(temporary, 'notes.md');
              fs.writeFileSync(body, notes);
              if (!release) {
                const args = ['release', 'create', tag, '--verify-tag', '--draft', '--title', title, '--notes-file', body];
                if (channel === 'beta') args.push('--prerelease');
                gh(args);
                release = await waitForRelease(current => current?.draft);
                if (!release?.draft) throw new Error('Expected an unpublished draft release');
              }
              const digest = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
              for (const name of expected) {
                const local = path.join('release-assets', name);
                if (release.assets.some(asset => asset.name === name)) {
                  gh(['release', 'download', tag, '--pattern', name, '--dir', temporary]);
                  if (digest(local) !== digest(path.join(temporary, name))) throw new Error(`Existing draft asset differs: ${name}. No asset was overwritten.`);
                } else {
                  gh(['release', 'upload', tag, local]);
                }
              }
              const complete = await waitForRelease(current => current?.draft && expected.every(name => current.assets.some(asset => asset.name === name)));
              if (!complete?.draft || !expected.every(name => complete.assets.some(asset => asset.name === name))) {
                throw new Error('Release asset verification failed; draft remains unpublished');
              }
              for (const name of expected) {
                const asset = complete.assets.find(item => item.name === name);
                const local = path.join('release-assets', name);
                if (asset.size !== fs.statSync(local).size) throw new Error(`Published asset size mismatch: ${name}`);
                if (asset.digest !== `sha256:${digest(local)}`) {
                  const downloaded = path.join(temporary, name);
                  if (!fs.existsSync(downloaded)) gh(['release', 'download', tag, '--pattern', name, '--dir', temporary]);
                  if (digest(local) !== digest(downloaded)) throw new Error(`Published asset digest mismatch: ${name}`);
                }
              }
              gh(['release', 'edit', tag, '--draft=false', `--prerelease=${channel === 'beta'}`, '--title', title, '--notes-file', body]);
              console.log(`Published ${title} with all required assets.`);
            } finally {
              fs.rmSync(temporary, { recursive: true, force: true });
            }
          }
          JS
