name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend lint and typecheck
        run: pnpm prepr:frontend:app
      - name: Frontend production build
        run: pnpm build
      - name: Release metadata tests
        run: node --test scripts/release-assets.test.mjs
      - name: Rust formatting
        run: cargo fmt --package ncreate-launcher --package ncreate-app-lib --package ncreate-launcher-core --check
      - name: Rust check
        run: cargo check --locked -p ncreate-launcher -p ncreate-app-lib -p ncreate-launcher-core --all-targets
      - name: Rust clippy
        run: cargo clippy --locked -p ncreate-launcher -p ncreate-app-lib -p ncreate-launcher-core --all-targets --no-deps -- -D warnings
      - name: Rust unit and deterministic integration tests
        run: cargo test --locked -p ncreate-launcher -p ncreate-app-lib -p ncreate-launcher-core
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate real platform Java executable
        run: cargo test --locked -p ncreate-launcher-core ci_installed_java -- --ignored
      - name: Native and network boundary audit
        run: node scripts/check-stage2-boundary.mjs
      - name: Build desktop installers
        run: pnpm app:build --bundles ${{ matrix.bundles }} --config tauri.ci.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
