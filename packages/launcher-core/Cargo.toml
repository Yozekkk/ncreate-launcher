[package]
name = "ncreate-launcher-core"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "time", "process", "net", "io-util", "rt-multi-thread", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
futures-util = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
zeroize = "1"
daedalus = { path = "upstream/daedalus" }
modrinth-content-management = { path = "upstream/modrinth-content-management" }
path-util = { path = "upstream/path-util" }
[dev-dependencies]
tempfile = "3"
