[package]
name = "ncreate-app-lib"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "NCreate adaptation of Modrinth App Minecraft authentication"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
heck = "0.5.0"
p256 = { version = "0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
rand = "=0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1.41"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
tiny_http = "0.12"
